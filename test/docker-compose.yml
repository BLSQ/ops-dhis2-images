version: '3'
services:
  core:
    image: "blsq/dhis2:${DHIS2_FULL_VERSION}"
    restart: always
    env_file: .env
    ports:
      - "8080:8080"    
    depends_on:
      - "db"
      - "clickhouse"      
  db:
    image: "postgis/postgis:16-3.5"
    command: "postgres -c max_locks_per_transaction=100"
    restart: always
    ports:
      - "5432:5432"    
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}


  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: ${DHIS_ANALYTICS_CONNECTION_USERNAME}
      CLICKHOUSE_PASSWORD: ${DHIS_ANALYTICS_CONNECTION_PASSWORD}
      CLICKHOUSE_ADMIN_USER: admin
      CLICKHOUSE_ADMIN_PASSWORD: ${DHIS_ANALYTICS_CONNECTION_PASSWORD}      
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      - "db"
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d      
      - ./users.d:/etc/clickhouse-server/users.d      